<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b9d">
<title>Приглашение 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="particles" id="particles"></div>
<div class="bg-decor"></div>
<div class="floating-hearts" id="floatingHearts"></div>

<!-- Progress bar -->
<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
  <div class="progress-dots" id="progressDots"></div>
</div>

<!-- Sound toggle -->
<button class="sound-toggle" id="soundToggle" aria-label="Звук">
  <span class="sound-on">🔊</span>
  <span class="sound-off">🔇</span>
</button>

<main class="container">

  <!-- ШАГ 0: Приглашение -->
  <section class="step active" data-step="0">
    <div class="card">
      <div class="svg-heart-wrap">
        <svg class="svg-heart" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff6b9d"/>
              <stop offset="50%" stop-color="#ff4d6d"/>
              <stop offset="100%" stop-color="#c9184a"/>
            </linearGradient>
          </defs>
          <path d="M50,88 C20,65 5,45 5,30 C5,15 18,5 32,5 C41,5 48,10 50,18 C52,10 59,5 68,5 C82,5 95,15 95,30 C95,45 80,65 50,88 Z" fill="url(#heartGrad)"/>
        </svg>
      </div>
      <h1 class="greeting" id="greeting"></h1>
      <p class="subtitle" id="subtitle"></p>
      <h2 class="question" id="question"></h2>
      <div class="buttons">
        <button class="btn btn-yes" id="btnYes"></button>
        <button class="btn btn-no" id="btnNo">
          <span class="no-text">Нет</span>
          <span class="no-heart">💖</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ШАГ 1: Место -->
  <section class="step" data-step="1">
    <div class="card">
      <h2 class="step-title" id="step2Title"></h2>
      <p class="step-subtitle" id="step2Subtitle"></p>
      <div class="places-grid" id="placesGrid"></div>
      <div class="step-nav">
        <button class="btn btn-back" data-back="0">← Назад</button>
      </div>
    </div>
  </section>

  <!-- ШАГ 2: День -->
  <section class="step" data-step="2">
    <div class="card">
      <h2 class="step-title" id="step3Title"></h2>
      <p class="step-subtitle" id="step3Subtitle"></p>
      <div class="days-grid" id="daysGrid"></div>
      <div class="step-nav">
        <button class="btn btn-back" data-back="1">← Назад</button>
      </div>
    </div>
  </section>

  <!-- ШАГ 3: Время (без часов — только кнопки) -->
  <section class="step" data-step="3">
    <div class="card">
      <h2 class="step-title" id="step4Title"></h2>
      <p class="step-subtitle" id="step4Subtitle"></p>

      <div class="time-section">
        <!-- Большое отображение времени -->
        <div class="time-big">
          <div class="time-big-value" id="timeBigValue">18:00</div>
          <div class="time-big-label">начало свидания</div>
        </div>

        <!-- Кнопки управления -->
        <div class="time-controls">
          <div class="time-group">
            <button class="tc-btn" data-unit="hour" data-dir="up" aria-label="Час +1">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 6l-6 8h12z" fill="currentColor"/></svg>
            </button>
            <div class="tc-value" id="tcHour">18</div>
            <button class="tc-btn" data-unit="hour" data-dir="down" aria-label="Час −1">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 18l6-8H6z" fill="currentColor"/></svg>
            </button>
            <div class="tc-label">часы</div>
          </div>

          <div class="time-sep">:</div>

          <div class="time-group">
            <button class="tc-btn" data-unit="minute" data-dir="up" aria-label="Минуты +5">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 6l-6 8h12z" fill="currentColor"/></svg>
            </button>
            <div class="tc-value" id="tcMinute">00</div>
            <button class="tc-btn" data-unit="minute" data-dir="down" aria-label="Минуты −5">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 18l6-8H6z" fill="currentColor"/></svg>
            </button>
            <div class="tc-label">минуты</div>
          </div>
        </div>

        <!-- Быстрые пресеты -->
        <div class="time-presets" id="timePresets"></div>
      </div>

      <div class="step-nav">
        <button class="btn btn-back" data-back="2">← Назад</button>
        <button class="btn btn-next" id="btnTimeConfirm">Подтвердить ✨</button>
      </div>
    </div>
  </section>

  <!-- ШАГ 4: ФИНАЛ -->
  <section class="step" data-step="4">
    <div class="card final-card">
      <div class="confetti" id="confetti"></div>

      <div class="svg-final">
        <svg viewBox="0 0 200 200" class="final-heart">
          <defs>
            <linearGradient id="finalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff6b9d"/>
              <stop offset="50%" stop-color="#ff4d6d"/>
              <stop offset="100%" stop-color="#c9184a"/>
            </linearGradient>
          </defs>
          <path d="M100,170 C40,125 10,90 10,60 C10,30 35,10 65,10 C82,10 95,20 100,35 C105,20 118,10 135,10 C165,10 190,30 190,60 C190,90 160,125 100,170 Z" fill="url(#finalGrad)"/>
          <!-- Маленькие блёстки вокруг -->
          <circle cx="20" cy="30" r="3" fill="#ffb3d9" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="180" cy="40" r="3" fill="#ffb3d9" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/>
          </circle>
          <circle cx="30" cy="150" r="2.5" fill="#b388ff" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
          </circle>
          <circle cx="170" cy="160" r="2.5" fill="#b388ff" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>

      <h2 class="final-title" id="finalTitle"></h2>
      <p class="final-message" id="finalMessage"></p>

      <div class="final-flirt" id="finalFlirt"></div>

      <div class="final-summary" id="finalSummary"></div>

      <p class="signature" id="signature"></p>

      <div class="final-actions">
        <a class="btn btn-contact" id="btnContact" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="vertical-align:middle;margin-right:8px;">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
          <span id="btnContactLabel"></span>
        </a>
        <p class="contact-subtext" id="contactSubtext"></p>
      </div>
    </div>
  </section>

</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
